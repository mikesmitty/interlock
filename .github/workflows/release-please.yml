on:
  push:
    branches:
      - main

name: Release Please

permissions:
  contents: write
  pull-requests: write

# Merging several pull requests in a row starts overlapping runs that race
# to update the release branch; run them one at a time.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A personal access token in RELEASE_PLEASE_TOKEN lets CI run on the
      # release pull request; without one the workflow's own token still
      # opens and merges it.
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      release-created: ${{ steps.release-please.outputs.release_created }}
      tag-name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}

  binaries:
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    needs: release-please
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      tag: ${{ needs.release-please.outputs.tag-name }}
    secrets: inherit
