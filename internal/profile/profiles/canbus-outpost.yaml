# canbus-outpost: four servo switch machines, four RailCom detectors and up
# to sixteen signal heads.
name: canbus-outpost
description: Servo switch machines, RailCom detectors and signal heads
match:
  manufacturer: mikesmitty
  model: CAN Bus Outpost
entities:
  - kind: turnout
    group: Servo
    name: ["{Description}", "{node} {group}"]
    enabled: Enabled
    events:
      throw: Throw Command Event
      close: Close Command Event
      center: Center Command Event
      thrown: Thrown Feedback Event
      closed: Closed Feedback Event
  - kind: block
    group: Track
    name: ["{Description}", "{node} {group}"]
    events:
      occupied: Occupied Event
      clear: Clear Event
  - kind: reporter
    group: Track
    name: ["{Description}", "{node} {group}"]
    events:
      range: Reporter ID
  - kind: signal_head
    group: Head
    name: ["{Description}", "{node} {group}"]
    enabled: Enabled
    events:
      dark: Dark Event
      red: Red Event
      yellow: Yellow Event
      green: Green Event
      lunar: Lunar Event
      s: S Event
      d: D Event
      number: Number Event
      flashing_red: Flashing Red Event
      flashing_yellow: Flashing Yellow Event
      flashing_green: Flashing Green Event
    # Only the aspects a head has a lamp for are on the bus; dark always is.
    needs:
      variables: [OUTR Lamp, OUTG Lamp, OUTB Lamp]
      values:
        red: "1"
        flashing_red: "1"
        yellow: "2"
        flashing_yellow: "2"
        green: "3"
        flashing_green: "3"
        lunar: "4"
        s: "5"
        d: "6"
        number: "7"
