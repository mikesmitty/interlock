# canbus-outpost: four servo switch machines, four RailCom detectors, up
# to sixteen signal heads, lamps on their own events and the signal test.
name: canbus-outpost
description: Servo switch machines, RailCom detectors and signal heads
match:
  manufacturer: mikesmitty
  model: CAN Bus Outpost
entities:
  - kind: turnout
    group: Servo
    name: ["{Description}", "{node} {group}"]
    enabled: Enabled
    # A servo output that carries the signal chain has no switch machine.
    unless:
      variable: Signal Heads/Connected To
      value: "{n}"
    events:
      throw: Throw Command Event
      close: Close Command Event
      center: Center Command Event
      thrown: Thrown Feedback Event
      closed: Closed Feedback Event
  - kind: block
    group: Track
    name: ["{Description}", "{node} {group}"]
    events:
      occupied: Occupied Event
      clear: Clear Event
  - kind: reporter
    group: Track
    name: ["{Description}", "{node} {group}"]
    events:
      range: Reporter ID
  - kind: signal_head
    group: Head
    name: ["{Description}", "{node} {group}"]
    enabled: Enabled
    events:
      dark: Dark Event
      red: Red Event
      yellow: Yellow Event
      green: Green Event
      lunar: Lunar Event
      s: S Event
      d: D Event
      number: Number Event
      flashing_red: Flashing Red Event
      flashing_yellow: Flashing Yellow Event
      flashing_green: Flashing Green Event
    # Only the aspects a head has a lamp for are on the bus, and dark only
    # when the aspects light any of its lamps: a head whose outputs are all
    # on their own events (8) is no signal.
    needs:
      variables: [R Lamp, G Lamp, Y Lamp]
      values:
        dark: ["1", "2", "3", "4", "5", "6", "7"]
        red: "1"
        flashing_red: "1"
        yellow: "2"
        flashing_yellow: "2"
        green: "3"
        flashing_green: "3"
        lunar: "4"
        s: "5"
        d: "6"
        number: "7"
  # From on until off, every chip on the signal chain lights red, yellow and
  # green in turn, whether a head is set up on it or not.
  - kind: switch
    group: Signal Test
    name: "{node} signal test"
    events:
      on: Start Event
      off: Stop Event
  # A head's output set to Own Events (lamp 8) is a lamp of its own, outside
  # the aspects: panel or building lights, or lamps lit together.
  - kind: switch
    group: Own Events
    id: R
    name: ["{Signal Heads/Head {n}/Description} output R", "{node} Head {n} output R"]
    when:
      - variable: Signal Heads/Head {n}/Enabled
        value: "1"
      - variable: Signal Heads/Head {n}/R Lamp
        value: "8"
    events:
      on: R On
      off: R Off
  - kind: switch
    group: Own Events
    id: Y
    name: ["{Signal Heads/Head {n}/Description} output Y", "{node} Head {n} output Y"]
    when:
      - variable: Signal Heads/Head {n}/Enabled
        value: "1"
      - variable: Signal Heads/Head {n}/Y Lamp
        value: "8"
    events:
      on: Y On
      off: Y Off
  - kind: switch
    group: Own Events
    id: G
    name: ["{Signal Heads/Head {n}/Description} output G", "{node} Head {n} output G"]
    when:
      - variable: Signal Heads/Head {n}/Enabled
        value: "1"
      - variable: Signal Heads/Head {n}/G Lamp
        value: "8"
    events:
      on: G On
      off: G Off
